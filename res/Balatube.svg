<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="270" height="380" viewBox="0 0 270 380" xmlns="http://www.w3.org/2000/svg">
  <!--
    Text labels are NOT drawn here: NanoSVG (the SVG renderer VCV Rack uses
    for panel backgrounds) does not support <text> elements, so any text
    placed in this file is silently invisible in Rack. All labels (knob
    names, section headers, title) are instead drawn in code by the
    TextLabel widget in Tubulum.cpp, positioned with mm2px() to line up with
    the graphics below. This file only holds background/frame/divider
    graphics.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b34"/>
      <stop offset="1" stop-color="#15151a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a6d2f"/>
      <stop offset="0.5" stop-color="#e8b34a"/>
      <stop offset="1" stop-color="#8a6d2f"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="270" height="380" fill="url(#bg)"/>

  <!-- Inner frame -->
  <rect x="5" y="5" width="260" height="370" rx="3" fill="none" stroke="#3a3a46" stroke-width="1.5"/>

  <!-- Title underline (title text drawn in code, see TubulumWidget) -->
  <rect x="70" y="37" width="130" height="2" rx="1" fill="url(#gold)"/>

  <!-- Section dividers are split in two, leaving a gap in the middle for
       the section header text (drawn in code, centered at x=135) so the
       line doesn't run straight through the label. -->

  <!-- Section divider: Resonator -> Effects -->
  <rect x="16" y="87" width="84" height="1.5" rx="0.75" fill="url(#gold)" opacity="0.8"/>
  <rect x="170" y="87" width="84" height="1.5" rx="0.75" fill="url(#gold)" opacity="0.8"/>

  <!-- Section divider: Effects -> CV -->
  <rect x="16" y="174" width="84" height="1.5" rx="0.75" fill="url(#gold)" opacity="0.8"/>
  <rect x="170" y="174" width="84" height="1.5" rx="0.75" fill="url(#gold)" opacity="0.8"/>

  <!-- Section divider: CV -> I/O -->
  <rect x="16" y="297" width="84" height="1.5" rx="0.75" fill="url(#gold)" opacity="0.8"/>
  <rect x="170" y="297" width="84" height="1.5" rx="0.75" fill="url(#gold)" opacity="0.8"/>
</svg>
